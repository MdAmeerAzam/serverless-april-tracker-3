name: Init Mutex Table
on:
  workflow_dispatch:
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node scripts/init_mutex_table.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
