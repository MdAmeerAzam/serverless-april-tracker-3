name: SAR 2 True Macro Genesis

on:
  schedule:
    - cron: '59 * * * *'
  workflow_dispatch:

jobs:
  genesis:
    name: Genesis Engine (SAR 2 Auto-Healer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run Macro Genesis
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/run_macro_genesis.js
