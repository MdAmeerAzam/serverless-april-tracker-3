name: One-Time Sheet Recovery Push

on:
  push:
    branches:
      - main

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
      - name: Run Sheet Recovery
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/recovery_macro.js
