name: Macro Cloud Sync & Backup

on:
  # STOPPED — June 10, 2026. Repo 3 (Macro) halted pending full rebuild.
  # All schedule triggers disabled. Manual dispatch preserved for controlled execution only.
  workflow_dispatch:

concurrency:
  group: macro-sync-repo3
  cancel-in-progress: true
jobs:
  sync:
    name: Sync TradingView → Supabase
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '5,20,35,50 * * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run Macro Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/run_macro_sync.js

  backup:
    name: Backup Supabase → Sheets
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '10,25,40,55 * * * *'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
      - name: Run Macro Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/run_macro_backup.js

  watchdog:
    name: Cloud Macro WATCHDOG
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '15 */4 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run Macro Health Audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/run_macro_watchdog.js
